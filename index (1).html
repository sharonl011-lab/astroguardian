<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AstroGuardian</title>
<meta name="description" content="Offline-first health monitoring dashboard for astronauts on long space missions. NASA Space Apps Challenge 2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--head:"Bricolage Grotesque","Trebuchet MS",sans-serif;--body:"Public Sans",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#0A0A0A;color:#E8ECF1;font:16px/1.5 var(--body)}
.s0{--c:#fff;--cb:#0B4F5C}.s1{--c:#fff;--cb:#8A4B0F}.s2{--c:#fff;--cb:#9B1C1C}
.pan .s0{--c:#6EE7DC;--cb:#0B4F5C}.pan .s1{--c:#FFD27A;--cb:#6B4410}.pan .s2{--c:#FF9A92;--cb:#7A1F1F}
#app{background:#0E0F12;min-height:100vh;padding:clamp(16px,4vw,48px)}
.top h1,#who h1,#pwho h1{font:700 clamp(1.8rem,4vw,2.6rem)/1.05 var(--head);margin:0;letter-spacing:-.02em}
.top p,#who p,#pwho p{margin:4px 0 0;color:#9AA6B2}
#cols{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-top:24px}
.col{all:unset;box-sizing:border-box;cursor:pointer;background:#fff;color:#14171B;border-radius:14px;padding:24px 12px;min-height:390px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;transition:transform .2s,box-shadow .2s}
.col:hover{transform:translateY(-6px);box-shadow:0 16px 40px rgba(0,0,0,.5)}
button:focus-visible,[data-part]:focus-visible{outline:3px solid #7FE3D8;outline-offset:3px}
.av{display:block;width:150px;height:176px;border-radius:14px;overflow:hidden;position:relative;margin-bottom:8px;background:linear-gradient(#8E959C,#1F5AA6)}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.av.sm{width:64px;height:75px;margin:0;border-radius:10px}
.nm{font:700 1.15rem/1.2 var(--head)}.rl{color:#566A80;font-size:.9rem}
.chip{font:600 .8rem var(--body);background:var(--cb);color:var(--c);padding:2px 12px;border-radius:99px}
.col .chip{margin-top:6px}
.bk{all:unset;cursor:pointer;color:#9AA6B2}.bk:hover{color:#fff}
#who,#pwho{display:flex;align-items:center;gap:16px;margin:12px 0 20px}
.per{display:grid;grid-template-columns:minmax(300px,480px) 1fr;gap:20px;align-items:start}
.fig,.pan{background:#16181C;border:1px solid #2A2E35;border-radius:14px;padding:18px}
.fig svg{width:100%;max-width:480px;display:block;margin:0 auto}
.fig p{text-align:center;color:#9AA6B2;font-size:.85rem;margin:8px 0 0}
.fig{background:#101216 radial-gradient(circle at 1px 1px,#1E2229 1px,transparent 0) 0 0/18px 18px}
.bp{cursor:pointer;transition:fill-opacity .2s}.bp:hover{fill-opacity:.5!important}.sil,.lb{cursor:pointer}.lb:hover text:first-of-type{fill:#fff}
.pulse{animation:pl 2s ease-in-out infinite}@keyframes pl{50%{opacity:.25}}@media(prefers-reduced-motion:reduce){.pulse{animation:none}}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-bottom:8px}.ov li{cursor:pointer}.ov li:hover{background:#242830}
.pan h2{font:700 1.5rem var(--head);margin:0 0 6px}.sub{color:#9AA6B2;margin:0 0 14px}
.mc{background:#1D2025;border-radius:10px;padding:14px;margin-bottom:12px;border-left:4px solid var(--c)}
.mh{display:flex;justify-content:space-between;align-items:center}.mh h3{margin:0;font:600 1.05rem var(--head)}
.mc svg{width:100%;height:auto;display:block;margin:8px 0}
.band{fill:rgba(255,255,255,.08)}.ln{fill:none;stroke:var(--c);stroke-width:2.5;stroke-linejoin:round}.dot{fill:var(--c)}
.how,.tip{margin:6px 0;font-size:.9rem}.how{color:#9AA6B2}
.ent label{display:flex;align-items:center;gap:10px;font-size:.9rem;color:#9AA6B2;flex-wrap:wrap}
.ent input{width:110px;padding:8px;border-radius:6px;border:1px solid #3A404A;background:#0E0F12;color:#fff;font:inherit}
.go{font:600 1rem var(--body);cursor:pointer;background:#F2EFE6;color:#14171B;border:0;border-radius:8px;padding:10px 20px}
.ov{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ov li{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;background:#1D2025;border-left:4px solid var(--c);padding:10px 12px;border-radius:6px}
.ov i{font-style:normal;color:var(--c);background:var(--cb);padding:2px 10px;border-radius:99px;font-size:.8rem}
.fine{margin:28px 0 0;color:#6F7B88;font-size:.85rem;max-width:80ch}
@media(max-width:1100px){#cols{grid-template-columns:repeat(3,1fr)}}
@media(max-width:820px){.per{grid-template-columns:1fr}}
@media(max-width:560px){#cols{grid-template-columns:repeat(2,1fr)}.col{min-height:350px}}
[hidden]{display:none!important}
.lock{overflow:hidden}
#intro{position:fixed;inset:0;z-index:50;background:#0A0A0A;display:grid;place-items:center;transition:opacity .7s ease,transform .7s ease}
#intro.out{opacity:0;transform:scale(1.06);pointer-events:none}
#water{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;padding:16px}
#logo{all:unset;display:block;cursor:pointer;width:clamp(170px,26vw,240px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#20252B,#14171B);box-shadow:0 0 0 1px rgba(255,255,255,.14),0 20px 60px rgba(0,0,0,.55);animation:bob 5s ease-in-out infinite;transition:transform .25s}
#logo:hover{transform:scale(1.06) rotate(-3deg)}
#logo:focus-visible{outline:3px solid #7FE3D8;outline-offset:6px}
#logo svg{width:100%;height:100%;margin:0;display:block}
@keyframes bob{50%{translate:0 -10px}}
.stage h2{margin:0;font:700 clamp(1.6rem,4vw,2.4rem)/1.1 var(--head);color:#F2EFE6;letter-spacing:-.01em}
.stage p{margin:0;color:#A9B4BF;font-size:.95rem}
#intro.go #logo{animation:none;pointer-events:none;transform:scale(2.4) rotate(300deg);opacity:0;transition:transform .9s cubic-bezier(.5,0,.2,1),opacity .7s ease .2s}
#intro.go .stage h2,#intro.go .stage p{opacity:0;transition:opacity .3s}
@media(prefers-reduced-motion:reduce){#logo{animation:none}}
</style>
</head>
<body class="lock">
<div id="intro">
  <canvas id="water" aria-hidden="true"></canvas>
  <div class="stage">
    <button id="logo" aria-label="Enter AstroGuardian">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <defs><filter id="wob" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".03" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="4"/></filter></defs>
        <g filter="url(#wob)" fill="none" stroke="#F2EFE6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="100" cy="100" r="90"/>
          <circle cx="100" cy="100" r="80" stroke-width="1.6" stroke-dasharray="1 9"/>
          <path d="M50 114C50 78 72 56 100 56s50 22 50 58c0 24-20 38-50 38s-50-14-50-38z" fill="#1B2026"/>
          <path d="M66 106c0-15 14-26 34-26s34 11 34 26-14 22-34 22-34-7-34-22z" fill="#0E7C7B" fill-opacity=".45"/>
          <path d="M72 106h14l6-14 8 24 6-14h24" stroke="#7FE3D8"/>
          <path d="M100 56V42"/><circle cx="100" cy="38" r="4" fill="#F2EFE6"/>
          <path d="M78 152v10h44v-10"/>
          <path d="M38 54v10M33 59h10M162 138v10M157 143h10M150 44l4 4M30 120l4 4" stroke-width="3"/>
          <path d="M22 130c34 46 120 52 158-8" stroke-dasharray="2 8" stroke-width="2.4"/>
        </g>
      </svg>
    </button>
    <h2>AstroGuardian</h2>
    <p>Click the logo to enter</p>
  </div>
</div>
<div id="app" hidden>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><filter id="w2" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".03" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3"/></filter></defs></svg>
<section id="crewPg">
  <div class="top"><h1>Crew</h1><p>Choose an astronaut to see their health.</p></div>
  <div id="cols"></div>
</section>
<section id="perPg" hidden>
  <button id="back" class="bk">&larr; Back to crew</button>
  <div id="who"></div>
  <div class="per"><div class="fig" id="fig"></div><div class="pan" id="ovw"></div></div>
</section>
<section id="partPg" hidden>
  <button id="back2" class="bk">&larr; Back to body</button>
  <div id="pwho"></div>
  <div class="pan" id="pbody"></div>
</section>
<p class="fine">Simulated data for the NASA Space Apps Challenge 2026. The crew members and their health data are fictional. AstroGuardian supports crew decisions and does not diagnose. Everything runs in your browser.</p>
</div>
<script>
const $=s=>document.querySelector(s);
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const gauss=r=>(r()+r()+r()+r()-2)*1.73,ST=['Nominal','Watch','Alert'];
const MET={
 hr:{n:'Heart rate',u:'bpm',ok:[55,95],w:[45,110],dp:0,def:68,sd:3,how:'Rest for 5 minutes, then read your pulse from the wrist sensor.',tip:'Rest, drink water and measure again in 30 minutes. If it stays out of range, contact the flight surgeon.'},
 bp:{n:'Blood pressure (top number)',u:'mmHg',ok:[95,125],w:[85,140],dp:0,def:112,sd:4,how:'Sit still, put the cuff on your upper arm and relax for one minute.',tip:'Rest, avoid salty food and measure again later. If it stays out of range, contact the flight surgeon.'},
 spo2:{n:'Blood oxygen',u:'%',ok:[95,100],w:[92,100],dp:1,def:97.5,sd:.5,how:'Clip the finger sensor on and keep your hand still for 30 seconds.',tip:'Check the sensor fit and cabin air readings, then measure again. Call the flight surgeon if it stays low.'},
 glu:{n:'Blood sugar',u:'mg/dL',ok:[70,110],w:[60,140],dp:0,def:90,sd:6,how:'Prick your fingertip with the lancet and touch the strip to the drop.',tip:'Review your last meal and activity. Eat or drink as advised and measure again, and tell the flight surgeon if it repeats.'},
 temp:{n:'Body temperature',u:'°C',ok:[36.1,37.4],w:[35.5,38],dp:1,def:36.7,sd:.15,how:'Use the forehead thermometer after resting, away from vents and heaters.',tip:'Rest, check the cabin temperature and drink water. A fever that lasts needs a call to the flight surgeon.'},
 sleep:{n:'Sleep',u:'hours',ok:[6.5,10],w:[5,12],dp:1,def:7.6,sd:.5,how:'Read last night’s total sleep from your sleep tracker.',tip:'Protect the sleep window, dim lights early and review the workload schedule with the crew.'},
 mood:{n:'Mood',u:'out of 5',ok:[3.5,5],w:[2.5,5],dp:1,def:4.2,sd:.4,how:'Rate how you feel today from 1 (very low) to 5 (great).',tip:'Talk to a crewmate, plan a shared meal and book a private call with the support team.'},
 ex:{n:'Exercise',u:'min',ok:[90,300],w:[45,300],dp:0,def:115,sd:15,how:'Add up today’s treadmill, bike and resistance time.',tip:'Add a session today. Daily exercise slows bone and muscle loss in low gravity.'}};
const PARTS={
 brain:{n:'Brain and mind',m:['mood','sleep'],t:'Controls sleep, mood and decisions. Isolation, confinement and a missing day and night cycle can disturb sleep and mood.'},
 lungs:{n:'Lungs',m:['spo2'],t:'Bring oxygen into the blood. Air quality in a closed cabin can change, so low oxygen readings matter.'},
 heart:{n:'Heart and vessels',m:['hr','bp'],t:'With less gravity the heart works less and body fluids shift toward the head, which can change heart rate and blood pressure.'},
 gut:{n:'Gut and metabolism',m:['glu'],t:'Handles food and blood sugar. Stress, new meals and less activity can shift blood sugar.'},
 bones:{n:'Bones and muscles',m:['ex'],t:'Bones lose density and muscles shrink in low gravity. Daily exercise is the main defense.'},
 body:{n:'Whole body',m:['temp'],t:'Body temperature can rise with infection, stress or a hot cabin, and the immune system changes in space.'}};
const PPL=[['Elena Petrova','Commander','#F6C177'],['Lena Voss','Flight engineer','#9AD1D4'],['Rafael Santos','Pilot','#F2A2A2'],['Mika Tanaka','Mission specialist','#B7D99A'],['Sofia Alvarez','Medical officer','#C9B6F2'],['Daniel Brooks','Geologist','#F3E58F']];
function gen(i){const r=rng(100+i*13),days=[];
 for(let d=0;d<14;d++){const o={};for(const k in MET)o[k]=MET[k].def+gauss(r)*MET[k].sd;
  const x=Math.max(0,d-8);
  if(i===1){o.hr+=x*6;o.sleep-=x*.5;o.mood-=x*.4}
  if(i===3)o.ex-=x*14;
  if(i===5){o.glu+=x*7;o.temp+=x*.05}
  o.spo2=Math.min(100,o.spo2);o.mood=Math.max(1,Math.min(5,o.mood));o.sleep=Math.max(2,Math.min(12,o.sleep));o.ex=Math.max(0,o.ex);days.push(o)}
 return days}
const KEY='astroguardian-v2';
const fresh=()=>({sel:-1,part:null,ppl:PPL.map((p,i)=>({n:p[0],r:p[1],c:p[2],d:gen(i)}))});
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.ppl&&s.ppl.length===6){s.ppl.forEach((p,i)=>{p.n=PPL[i][0];p.r=PPL[i][1];p.c=PPL[i][2]});return s}}catch(e){}return fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load();S.sel=-1;S.part=null;S.view='crew';
const inR=(v,r)=>v>=r[0]&&v<=r[1],stat=(k,v)=>inR(v,MET[k].ok)?0:inR(v,MET[k].w)?1:2;
const last=p=>p.d[p.d.length-1],fmt=(k,v)=>v.toFixed(MET[k].dp);
const pStat=p=>Math.max(...Object.keys(MET).map(k=>stat(k,last(p)[k])));
const partStat=(p,k)=>Math.max(...PARTS[k].m.map(m=>stat(m,last(p)[m])));
const FK=[{g:'f',skin:'#F1CDAE',hair:'#BFC5CE',hs:'pixie',age:1},{g:'f',skin:'#D6A57B',hair:'#15181D',hs:'long',gl:1},{g:'m',skin:'#C28A63',hair:'#15181D',hs:'quiff',beard:1,age:1},{g:'m',skin:'#E8C29B',hair:'#1B1B1F',hs:'crop'},{g:'f',skin:'#B3764E',hair:'#2B1A12',hs:'curly'},{g:'m',skin:'#8A5839',hair:'#101215',hs:'short',gl:1,stub:1,age:1}];
const HB={long:'<path d="M28 46C22 78 26 102 36 116L84 116C94 102 98 78 92 46C90 22 76 10 60 10C44 10 30 22 28 46Z"/>',curly:'<circle cx="36" cy="34" r="9"/><circle cx="46" cy="20" r="10"/><circle cx="60" cy="14" r="10"/><circle cx="74" cy="20" r="10"/><circle cx="84" cy="34" r="9"/><circle cx="31" cy="50" r="7"/><circle cx="89" cy="50" r="7"/>'};
const HF={pixie:'M31 50C28 26 42 10 62 10C82 10 92 26 89 50C86 40 82 32 72 28C64 34 46 34 36 40C33 43 32 46 31 50Z',long:'M31 52C29 26 42 10 62 10C82 10 92 26 89 52C86 40 80 30 70 26C60 34 44 36 34 44Z',curly:'M36 38C46 30 74 30 84 38C80 26 72 22 60 22C48 22 40 26 36 38Z',quiff:'M31 48C28 24 42 10 64 10C84 10 92 26 88 46C85 34 78 26 66 24C58 32 44 34 34 42Z',crop:'M31 48C30 26 42 12 60 12C78 12 90 26 89 48C86 36 78 28 60 28C42 28 34 36 31 48Z',short:'M32 44C32 26 44 14 60 14C76 14 88 26 88 44C84 32 76 26 60 26C44 26 36 32 32 44Z'};
const shade=(h,f=.82)=>'#'+[1,3,5].map(i=>Math.round(parseInt(h.substr(i,2),16)*f).toString(16).padStart(2,'0')).join('');
function cartoon(i){const k=FK[i],f=k.g==='f',sk=k.skin,sd=shade(sk),O='#0B0F1A';
 const eye=x=>`<path d="M${x-7} 55Q${x} 50 ${x+7} 55Q${x} 59 ${x-7} 55Z" fill="#F4F1EC" stroke-width="1.5"/><circle cx="${x}" cy="54.6" r="2.7" fill="#2B2118" stroke="none"/><path d="M${x-8} 54.5Q${x} 48.5 ${x+8} 54.5" fill="none" stroke-width="3"/>`;
 const brow=f?`<path d="M35 48Q45 43 57 49L56 51Q46 47 36 50Z" stroke-width="1"/><path d="M85 48Q75 43 63 49L64 51Q74 47 84 50Z" stroke-width="1"/>`:`<path d="M34 47Q45 40 57 48L56 52Q46 46 35 51Z" stroke-width="1"/><path d="M86 47Q75 40 63 48L64 52Q74 46 85 51Z" stroke-width="1"/>`;
 const mouth=f?`<path d="M50 86Q55 83 60 85Q65 83 70 86Q60 92 50 86Z" fill="#B4474F" stroke-width="2"/>`:`<path d="M50 87Q60 90 70 86" fill="none" stroke-width="3"/><path d="M54 92Q60 94 66 92" fill="none" stroke-width="1.6" stroke-opacity=".5"/>`;
 const beard=k.beard?`<path d="M46 82Q60 76 74 82Q60 80 46 82Z" fill="${O}"/><path d="M52 94Q60 104 68 94Q60 97 52 94Z" fill="${O}"/>`:'';
 const stub=(k.stub||k.beard)?`<path d="M34 72L46 94L55 103H65L74 94L86 72Q74 86 60 86Q46 86 34 72Z" fill="${k.hair}" fill-opacity=".28" stroke="none"/>`:'';
 const age=k.age?`<path d="M45 75Q43 83 46 90M75 75Q77 83 74 90M40 61Q47 64 54 61M66 61Q73 64 80 61" fill="none" stroke-width="1.4" stroke-opacity=".4"/>`:'';
 const gl=k.gl?`<rect x="35" y="47" width="25" height="15" rx="4" fill="rgba(170,200,230,.18)" stroke-width="2.4"/><rect x="60" y="47" width="25" height="15" rx="4" fill="rgba(170,200,230,.18)" stroke-width="2.4"/><path d="M59 52H61M35 51L31 49M85 51L89 49" fill="none" stroke-width="2"/>`:'';
 const lash=f?`<path d="M40 54L37 51M80 54L83 51" stroke-width="2" fill="none"/>`:'';
 return `<svg viewBox="0 0 120 140" width="100%" height="100%" aria-hidden="true"><g stroke="${O}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
<g fill="${k.hair}" stroke-width="3">${HB[k.hs]||''}</g>
<path d="M0 140C2 112 24 106 60 106S118 112 120 140Z" fill="#2A3A5C" stroke-width="3"/><path d="M84 109C104 113 116 124 118 140L98 140C98 128 94 117 84 109Z" fill="#1B2742" stroke="none"/>
<path d="M60 118V140" fill="none" stroke="#7F93B8" stroke-width="1.6"/><rect x="22" y="124" width="18" height="7" rx="1.5" fill="#E9EDF3" stroke-width="1.6"/><rect x="86" y="122" width="14" height="10" rx="1.5" fill="#B33A3A" stroke-width="1.6"/>
<path d="M46 96V110Q60 120 74 110V96Z" fill="${sk}" stroke-width="3"/><path d="M46 104Q60 114 74 104V110Q60 120 46 110Z" fill="${sd}" stroke="none"/>
<path d="M42 104Q60 118 78 104L80 112Q60 128 40 112Z" fill="#33466E"/>
<path d="M32 54C26 52 25 66 34 68M88 54C94 52 95 66 86 68" fill="${sk}"/>
<path d="M60 14C42 14 32 28 32 46L34 72L46 94L55 103H65L74 94L86 72L88 46C88 28 78 14 60 14Z" fill="${sk}" stroke-width="3"/>
<path d="M76 26C86 32 88 46 88 46L86 72L74 94L65 103L69 93C79 78 83 52 76 26Z" fill="${sd}" stroke="none"/>
<path d="M38 62Q40 55 45 60Q42 67 38 70Z" fill="#fff" fill-opacity=".22" stroke="none"/>${stub}
${eye(47)}${eye(73)}${lash}${brow}${age}

 y=n=>H-6-(n-lo)/(hi-lo||1)*(H-12),x=i=>6+i*(W-12)/Math.max(v.length-1,1);
 return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${M.n} trend"><rect x="0" y="${y(M.ok[1])}" width="${W}" height="${y(M.ok[0])-y(M.ok[1])}" class="band"/><polyline points="${v.map((n,i)=>x(i).toFixed(1)+','+y(n).toFixed(1)).join(' ')}" class="ln"/><circle cx="${x(v.length-1)}" cy="${y(v[v.length-1])}" r="4.5" class="dot"/></svg>`}

function smooth(q){let d=`M${q[0][0]} ${q[0][1]}`;
 for(let i=0;i<q.length-1;i++){const p0=q[i-1]||q[i],p1=q[i],p2=q[i+1],p3=q[i+2]||p2;
  d+=`C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)} ${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)} ${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0]} ${p2[1]}`}
 return d+'Z'}

function detail(p){const L=last(p),P=PARTS[S.part];
 return `<p class="sub">${P.t}</p><div class="cards">`+P.m.map(m=>{const M=MET[m],v=L[m],s=stat(m,v);
  return `<article class="mc s${s}"><div class="mh"><h3>${M.n}</h3><span class="chip">${ST[s]}</span></div>${spark(p,m)}<p class="how"><b>Normal range:</b> ${M.ok[0]} to ${M.ok[1]} ${M.u}. <b>How to measure:</b> ${M.how}</p><p class="tip">${s?M.tip:'In the normal range. Keep your routine.'}</p><div class="ent"><label>New reading (${M.u}) <input type="number" step="any" id="in-${m}" value="${fmt(m,v)}"></label></div></article>`}).join('')+'</div><p><button class="go" id="save">Save readings</button></p>'}
function render(){
 const v=S.view;$('#crewPg').hidden=v!=='crew';$('#perPg').hidden=v!=='person';$('#partPg').hidden=v!=='part';
 if(v==='crew'){$('#cols').innerHTML=S.ppl.map((p,i)=>{const s=pStat(p);return `<button class="col s${s}" data-p="${i}"><span class="av">${face(i,96)}</span><span class="nm">${p.n}</span><span class="rl">${p.r}</span><span class="chip">${ST[s]}</span></button>`}).join('');return}
 const p=S.ppl[S.sel],av=`<span class="av sm">${face(S.sel,56)}</span>`;
 if(v==='person'){$('#who').innerHTML=av+`<div><h1>${p.n}</h1><p>${p.r}</p></div>`;$('#fig').innerHTML=body(p);$('#ovw').innerHTML=overview(p);return}
 $('#pwho').innerHTML=av+`<div><p>${p.n}, ${p.r}</p><h1>${PARTS[S.part].n}</h1></div>`;$('#pbody').innerHTML=detail(p)}
function pick(el){const c=el.closest('[data-p]');if(c){S.sel=+c.dataset.p;S.part=null;S.view='person';render();scrollTo(0,0);return true}
 const b=el.closest('[data-part]');if(b){S.part=b.dataset.part;S.view='part';render();scrollTo(0,0);return true}return false}
document.addEventListener('click',e=>{const t=e.target;if(pick(t))return;
 if(t.closest('#back')){S.view='crew';S.sel=-1;render();scrollTo(0,0)}
 else if(t.closest('#back2')){S.view='person';S.part=null;render();scrollTo(0,0)}
 else if(t.closest('#save')){const p=S.ppl[S.sel],n={...last(p)};PARTS[S.part].m.forEach(m=>{const v=parseFloat($('#in-'+m).value);if(!isNaN(v))n[m]=v});p.d.push(n);if(p.d.length>40)p.d.shift();save();render();$('#save').textContent='Saved'}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[data-part]')){e.preventDefault();pick(e.target)}});
render();
</script>
<script>
(function(){
 const VERT='attribute vec2 a_position;varying vec2 vUv;void main(){vUv=.5*(a_position+1.);gl_Position=vec4(a_position,0.,1.);}';
 const FRAG=`#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
varying vec2 vUv;
uniform sampler2D u_image_texture;
uniform float u_time,u_ratio,u_img_ratio,u_blueish,u_scale,u_illumination,u_surface_distortion,u_water_distortion;
vec3 mod289(vec3 x){return x-floor(x*(1./289.))*289.;}
vec2 mod289(vec2 x){return x-floor(x*(1./289.))*289.;}
vec3 permute(vec3 x){return mod289(((x*34.)+1.)*x);}
float snoise(vec2 v){
 const vec4 C=vec4(0.211324865405187,0.366025403784439,-0.577350269189626,0.024390243902439);
 vec2 i=floor(v+dot(v,C.yy));vec2 x0=v-i+dot(i,C.xx);
 vec2 i1=(x0.x>x0.y)?vec2(1.,0.):vec2(0.,1.);
 vec4 x12=x0.xyxy+C.xxzz;x12.xy-=i1;i=mod289(i);
 vec3 p=permute(permute(i.y+vec3(0.,i1.y,1.))+i.x+vec3(0.,i1.x,1.));
 vec3 m=max(0.5-vec3(dot(x0,x0),dot(x12.xy,x12.xy),dot(x12.zw,x12.zw)),0.);
 m=m*m;m=m*m;
 vec3 x=2.*fract(p*C.www)-1.;vec3 h=abs(x)-0.5;vec3 ox=floor(x+0.5);vec3 a0=x-ox;
 m*=1.79284291400159-0.85373472095314*(a0*a0+h*h);
 vec3 g;g.x=a0.x*x0.x+h.x*x0.y;g.yz=a0.yz*x12.xz+h.yz*x12.yw;
 return 130.*dot(m,g);}
mat2 rotate2D(float r){return mat2(cos(r),sin(r),-sin(r),cos(r));}
float surface_noise(vec2 uv,float t,float scale){
 vec2 n=vec2(.1);vec2 N=vec2(.1);mat2 m=rotate2D(.5);
 for(int j=0;j<10;j++){uv*=m;n*=m;
  vec2 q=uv*scale+float(j)+n+(.5+.5*float(j))*(mod(float(j),2.)-1.)*t;
  n+=sin(q);N+=cos(q)/scale;scale*=1.2;}
 return (N.x+N.y+.1);}
void main(){
 vec2 uv=vUv;uv.y=1.-uv.y;uv.x*=u_ratio;
 float t=.002*u_time;
 float outer_noise=snoise((.3+.1*sin(t))*uv+vec2(0.,.2*t));
 vec2 suv=2.*uv+(outer_noise*.2);
 float surf=surface_noise(suv,t,u_scale);
 surf*=pow(uv.y,.3);surf=pow(surf,2.);
 vec2 iuv=vUv-.5;
 if(u_ratio>u_img_ratio){iuv.y=iuv.y*u_img_ratio/u_ratio;}else{iuv.x=iuv.x*u_ratio/u_img_ratio;}
 iuv*=.85;iuv+=.5;iuv.y=1.-iuv.y;
 iuv+=(u_water_distortion*outer_noise);iuv+=(u_surface_distortion*surf);
 vec4 img=texture2D(u_image_texture,iuv);
 img*=(1.+u_illumination*surf);
 vec3 color=img.rgb+u_illumination*vec3(.85)*surf;
 float ew=.02;
 float ea=smoothstep(0.,ew,iuv.x)*smoothstep(1.,1.-ew,iuv.x)*smoothstep(0.,ew,iuv.y)*smoothstep(1.,1.-ew,iuv.y);
 gl_FragColor=vec4(color*ea,img.a*ea);}`;
 const intro=$('#intro'),cv=$('#water');let raf=0,run=true,t0=0;
 function art(){const c=document.createElement('canvas');c.width=1600;c.height=900;const g=c.getContext('2d');
  const b=g.createLinearGradient(0,0,0,900);b.addColorStop(0,'#161616');b.addColorStop(1,'#060606');g.fillStyle=b;g.fillRect(0,0,1600,900);
  [[.25,.3,700,'rgba(255,255,255,.07)'],[.75,.25,600,'rgba(255,255,255,.05)'],[.6,.85,700,'rgba(255,255,255,.04)']].forEach(([x,y,r,col])=>{
   const d=g.createRadialGradient(x*1600,y*900,0,x*1600,y*900,r);d.addColorStop(0,col);d.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=d;g.fillRect(0,0,1600,900)});
  g.strokeStyle='rgba(255,255,255,.07)';g.lineWidth=2;[420,620,820].forEach(r=>{g.beginPath();g.ellipse(800,450,r,r*.38,-.25,0,7);g.stroke()});
  const r=rng(11);for(let i=0;i<500;i++){g.fillStyle='rgba(255,255,255,'+(.15+r()*.6)+')';const z=r()<.1?3:2;g.fillRect(r()*1600,r()*900,z,z)}
  g.globalAlpha=.5;const m=g.createRadialGradient(1230,250,10,1250,270,110);m.addColorStop(0,'#DDDDDD');m.addColorStop(1,'#3A3A3A');
  g.fillStyle=m;g.beginPath();g.arc(1250,270,100,0,7);g.fill();return c}
 const gl=cv.getContext('webgl',{alpha:false})||cv.getContext('experimental-webgl');
 if(gl){try{
  const mk=(t,s)=>{const h=gl.createShader(t);gl.shaderSource(h,s);gl.compileShader(h);if(!gl.getShaderParameter(h,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(h));return h};
  const pr=gl.createProgram();gl.attachShader(pr,mk(gl.VERTEX_SHADER,VERT));gl.attachShader(pr,mk(gl.FRAGMENT_SHADER,FRAG));gl.linkProgram(pr);gl.useProgram(pr);
  gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(pr,'a_position');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  const U=n=>gl.getUniformLocation(pr,n);
  gl.bindTexture(gl.TEXTURE_2D,gl.createTexture());
  [[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]].forEach(([a,b])=>gl.texParameteri(gl.TEXTURE_2D,a,b));
  const A=art();gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,A);
  gl.uniform1i(U('u_image_texture'),0);gl.uniform1f(U('u_img_ratio'),A.width/A.height);
  const uIL=U('u_illumination'),uSD=U('u_surface_distortion');
  gl.uniform1f(U('u_blueish'),.4);gl.uniform1f(U('u_scale'),7);gl.uniform1f(uIL,.12);gl.uniform1f(uSD,.04);gl.uniform1f(U('u_water_distortion'),.02);
  const uT=U('u_time'),uR=U('u_ratio');
  const fit=()=>{const d=Math.min(devicePixelRatio||1,1.5);cv.width=innerWidth*d|0;cv.height=innerHeight*d|0;gl.viewport(0,0,cv.width,cv.height);gl.uniform1f(uR,cv.width/cv.height)};
  fit();addEventListener('resize',fit);
  const draw=t=>{gl.uniform1f(uT,t);if(t0){const k=Math.min(1,(t-t0)/900);gl.uniform1f(uSD,.04+k*.2);gl.uniform1f(uIL,.12+k*.35)}gl.drawArrays(gl.TRIANGLE_STRIP,0,4);if(run)raf=requestAnimationFrame(draw)};
  raf=requestAnimationFrame(draw);
 }catch(e){console.error(e)}}
 let going=false;
 $('#logo').addEventListener('click',()=>{
  if(going)return;going=true;
  const app=$('#app'),calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const done=()=>{app.style.cssText='';document.body.classList.remove('lock');scrollTo(0,0);intro.hidden=true;run=false;cancelAnimationFrame(raf)};
  if(calm){app.hidden=false;return done()}
  intro.classList.add('go');t0=performance.now();
  setTimeout(()=>{
   app.style.cssText='position:relative;z-index:60;clip-path:circle(0px at 50vw 50vh);transition:clip-path 1s cubic-bezier(.6,0,.2,1)';
   app.hidden=false;void app.offsetWidth;app.style.clipPath='circle(75vmax at 50vw 50vh)';
   setTimeout(done,1050)},550)});
})();
</script>
